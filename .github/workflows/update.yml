name: Update Codex package

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-codex-package
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 1

      - name: Update package inputs
        run: nix develop --command ./scripts/update.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- flake.nix flake.lock versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add build swap
        if: steps.changes.outputs.changed == 'true'
        run: |
          sudo fallocate -l 8G /codex-build.swap
          sudo chmod 600 /codex-build.swap
          sudo mkswap /codex-build.swap
          sudo swapon /codex-build.swap
          free -h
          df -h /

      - name: Validate update
        if: steps.changes.outputs.changed == 'true'
        run: |
          (
            while sleep 30; do
              free -h
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT

          nix flake check --no-build --print-build-logs

          # Keep the memory-saving release overrides local to CI. Evaluate the
          # normal checks above, then build and check the overridden binary.
          # shellcheck disable=SC2016 # The interpolation below belongs to Nix.
          build_json="$(nix build --impure --no-link --json --print-build-logs --expr '
            let
              flake = builtins.getFlake (toString ./.);
              codex = flake.packages.${builtins.currentSystem}.codex;
            in
              codex.overrideAttrs (old: {
                env = old.env // {
                  CARGO_PROFILE_RELEASE_LTO = "off";
                  CARGO_PROFILE_RELEASE_DEBUG = "0";
                };
              })
          ')"
          package_path="$(jq -r '.[0].outputs.out' <<< "$build_json")"
          expected_version="$(jq -r '.version' versions.json)"
          version="$("$package_path/bin/codex" --version)"
          case "$version" in
            *"$expected_version"*) echo "Validated $version" ;;
            *)
              echo "expected codex version $expected_version, got: $version" >&2
              exit 1
              ;;
          esac

      - name: Commit update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flake.nix flake.lock versions.json
          git commit -m "Update Codex package inputs"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Report no-op
        if: steps.changes.outputs.changed == 'false'
        run: echo "Codex package inputs are already current."
